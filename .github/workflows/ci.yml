name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p "test_*.py" -v
        env:
          PYTHONUTF8: "1"
      - name: сканер на самом себе (не должен находить critical)
        run: python skills/security-audit/scripts/audit.py . --no-deps --fail-on critical --report self-report.md
